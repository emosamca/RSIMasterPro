<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>RSI Master Pro — Coin Yönetimi</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 640px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; margin-bottom: .5em; }
  .sub { color: #777; font-size: .9em; margin-bottom: 1.5em; }
  form { display: flex; gap: .5em; margin: 1em 0 1.5em; }
  form input { flex: 1; padding: .55em .7em; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
  form button { padding: .55em 1.2em; font-size: 1em; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
  form button:hover { background: #1d4ed8; }
  table { width: 100%; border-collapse: collapse; font-size: .95em; }
  th { text-align: left; padding: .6em .4em; border-bottom: 2px solid #ddd; color: #555; font-weight: 600; }
  td { padding: .55em .4em; border-bottom: 1px solid #eee; }
  td.sym { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  td.date { color: #888; font-size: .85em; }
  button.del { padding: .35em .8em; border: 1px solid #f3b4b4; border-radius: 4px; background: #fff5f5; color: #c43030; cursor: pointer; }
  button.del:hover { background: #fecaca; }
  .empty { color: #999; font-style: italic; padding: 1em; text-align: center; }
  .msg { padding: .6em .8em; margin-bottom: 1em; border-radius: 4px; display: none; }
  .msg.err { background: #fee; color: #b30000; border: 1px solid #fbb; display: block; }
  .msg.ok { background: #eef9e8; color: #1a6b1a; border: 1px solid #b7e4a3; display: block; }
</style>
</head>
<body>
  <div style="margin-bottom:1em;font-size:.95em">
    <a href="/" style="margin-right:.8em;color:#2563eb;text-decoration:none"><strong>Koin Listesi</strong></a> |
    <a href="/dashboard.html" style="margin:0 .4em;color:#2563eb;text-decoration:none">Sanal İşlemler</a> |
    <a href="/settings.html" style="margin-left:.4em;color:#2563eb;text-decoration:none">Strateji Ayarları</a>
  </div>
  <h1>RSI Master Pro — Coin Yönetimi</h1>
  <div class="sub">Servis bu listedeki coin'ler için 15 dakikalık taramayı yapar.</div>

  <div id="msg" class="msg"></div>

  <form onsubmit="addSymbol(event)">
    <input id="newSymbol" type="text" placeholder="Yeni coin (örn. SOLUSDT)" autocomplete="off" required>
    <button type="submit">Ekle</button>
  </form>

  <table>
    <thead>
      <tr><th>Sembol</th><th>Eklenme (UTC)</th><th></th></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="3" class="empty">Yükleniyor...</td></tr>
    </tbody>
  </table>

<script>
const api = '/api/symbols';
const rows = document.getElementById('rows');
const msg = document.getElementById('msg');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
  setTimeout(() => { msg.className = 'msg'; msg.textContent = ''; }, 3000);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}

async function load() {
  try {
    const res = await fetch(api);
    const data = await res.json();
    if (data.length === 0) {
      rows.innerHTML = '<tr><td colspan="3" class="empty">Hiç coin yok. Yukarıdan ekleyebilirsin.</td></tr>';
      return;
    }
    rows.innerHTML = data.map(s => `
      <tr>
        <td class="sym">${s.symbol}</td>
        <td class="date">${fmtDate(s.createdAt)}</td>
        <td style="text-align:right">
          <button class="del" onclick="removeSymbol('${s.symbol}')">Sil</button>
        </td>
      </tr>`).join('');
  } catch (e) {
    showMsg('Liste yüklenemedi: ' + e.message, 'err');
  }
}

async function addSymbol(e) {
  e.preventDefault();
  const input = document.getElementById('newSymbol');
  const sym = input.value.trim().toUpperCase();
  if (!sym) return;
  try {
    const res = await fetch(api, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol: sym })
    });
    if (!res.ok) {
      showMsg('Eklenemedi: ' + await res.text(), 'err');
      return;
    }
    input.value = '';
    showMsg(sym + ' eklendi.', 'ok');
    load();
  } catch (e) {
    showMsg('Hata: ' + e.message, 'err');
  }
}

async function removeSymbol(sym) {
  if (!confirm(sym + ' silinsin mi?')) return;
  try {
    const res = await fetch(api + '/' + encodeURIComponent(sym), { method: 'DELETE' });
    if (!res.ok && res.status !== 404) {
      showMsg('Silinemedi.', 'err');
      return;
    }
    showMsg(sym + ' silindi.', 'ok');
    load();
  } catch (e) {
    showMsg('Hata: ' + e.message, 'err');
  }
}

load();
</script>
</body>
</html>
